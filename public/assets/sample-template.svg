<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="850" fill="url(#bgGrad)"/>

  <!-- Elegant Decorative Borders -->
  <rect x="30" y="30" width="1140" height="790" fill="none" stroke="#1e3a8a" stroke-width="6"/>
  <rect x="45" y="45" width="1110" height="760" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <rect x="52" y="52" width="1096" height="746" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Corner Ornaments -->
  <g fill="none" stroke="#b45309" stroke-width="2">
    <path d="M 60 90 L 90 90 L 90 60" />
    <path d="M 1140 90 L 1110 90 L 1110 60" />
    <path d="M 60 760 L 90 760 L 90 790" />
    <path d="M 1140 760 L 1110 760 L 1110 790" />
  </g>

  <!-- Ribbon / Badge Icon -->
  <circle cx="600" cy="120" r="36" fill="url(#goldGrad)" />
  <polygon points="585,145 580,185 600,172 620,185 615,145" fill="#b45309" />
  <circle cx="600" cy="120" r="28" fill="#ffffff" />
  <text x="600" y="127" font-family="'Times New Roman', serif" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">★</text>

  <!-- Certificate Main Title -->
  <text x="600" y="210" font-family="'Times New Roman', Georgia, serif" font-size="44" font-weight="bold" letter-spacing="4" fill="#0f172a" text-anchor="middle">CERTIFICATE OF ACHIEVEMENT</text>
  <text x="600" y="245" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" letter-spacing="3" fill="#64748b" text-anchor="middle">THIS IS PROUDLY PRESENTED TO</text>

  <!-- 1st DASHED LINE: RECIPIENT NAME BASELINE -->
  <!-- Box area: x=250, y=320, width=700, height=70 -->
  <line x1="250" y1="380" x2="950" y2="380" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="10, 8" />
  <text x="600" y="405" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-style="italic" fill="#94a3b8" text-anchor="middle">(Recipient Full Name)</text>

  <!-- Achievement Description -->
  <text x="600" y="465" font-family="'Times New Roman', Georgia, serif" font-size="20" fill="#334155" text-anchor="middle">for successfully demonstrating exceptional excellence and completion of</text>
  <text x="600" y="498" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#1e3a8a" text-anchor="middle">The Advanced Full-Stack &amp; AI Engineering Program</text>

  <!-- 2nd DASHED LINE: ROLL NUMBER / REGISTRATION ID BASELINE -->
  <!-- Box area: x=400, y=540, width=400, height=50 -->
  <line x1="400" y1="585" x2="800" y2="585" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8, 6" />
  <text x="600" y="608" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-style="italic" fill="#94a3b8" text-anchor="middle">(Roll / Registration Number)</text>

  <!-- Signatures Section -->
  <g transform="translate(0, 720)">
    <!-- Left Signature -->
    <line x1="200" y1="0" x2="450" y2="0" stroke="#475569" stroke-width="1.5" />
    <text x="325" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">Dr. Arthur Pendelton</text>
    <text x="325" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Program Director</text>

    <!-- Center Seal -->
    <circle cx="600" cy="-20" r="32" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="4, 3" />
    <text x="600" y="-15" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">OFFICIAL</text>
    <text x="600" y="-2" font-family="'Times New Roman', serif" font-size="9" fill="#b45309" text-anchor="middle">SEAL</text>

    <!-- Right Signature -->
    <line x1="750" y1="0" x2="1000" y2="0" stroke="#475569" stroke-width="1.5" />
    <text x="875" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">Prof. Eleanor Vance</text>
    <text x="875" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Dean of Academic Affairs</text>
  </g>
</svg>

